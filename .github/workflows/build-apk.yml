name: Build APK

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode keystore from secrets
        run: |
          if [ -n "$OTF_JKS_BASE64" ]; then
            echo "$OTF_JKS_BASE64" | base64 -d > app/otf-control.jks
            echo "keystore decoded"
          else
            echo "no keystore secret, will build debug only"
          fi
        env:
          OTF_JKS_BASE64: ${{ secrets.OTF_JKS_BASE64 }}

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon 2>&1 | tee build-output.log
        continue-on-error: true

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
        continue-on-error: true

      - name: Build Release APK
        if: ${{ secrets.OTF_JKS_BASE64 != '' }}
        run: ./gradlew assembleRelease --no-daemon 2>&1 | tee -a build-output.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.log

      - name: Prepare release APK
        if: ${{ secrets.OTF_JKS_BASE64 != '' }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk ZaralynControl-v${{ github.run_number }}.apk

      - name: Create GitHub Release
        if: ${{ secrets.OTF_JKS_BASE64 != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ZaralynControl v${{ github.run_number }}
          body: |
            ## ZaralynControl v${{ github.run_number }}

            基于家长管理反编译代码的管控修改工具。

            - 镜像库权威（可手动从家长管理/云端拉取）
            - 自动适配新版(install_app_list)和旧版(forbidden_app)
            - 云端双向同步（jpush/content 拉取 + controlApp/upload 上传）
            - 后台自动同步（默认 1 分钟，可配置）
            - 失败重试 3 次，全程 debug 日志
          files: ZaralynControl-v${{ github.run_number }}.apk